name: Rebuild Zarpuls ZIP

on:
  push:
    branches: [main]
    paths:
      - '.zarpuls-upload/READY'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .zarpuls-upload/part-*.txt | base64 --decode > zarpuls-infographic.zip
          echo "1ae8483fdcc979e40d3884540cc2348493f236c46b471eef1960e16207d38aa5  zarpuls-infographic.zip" | sha256sum -c -

      - name: Commit ZIP and remove transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zarpuls-infographic.zip
          git rm -r .zarpuls-upload
          git commit -m "Add zarpuls-infographic.zip"
          git push
